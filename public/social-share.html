<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360EYE Social Share Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            font-family: 'Montserrat', sans-serif;
        }
        .container {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo {
            width: 300px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: 600;
        }
        p {
            font-size: 24px;
            margin: 0;
            text-align: center;
            max-width: 80%;
            color: #cccccc;
        }
        .accent {
            color: #87BA3A;
        }
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }
        .services {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }
        .service {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 180px;
        }
        .service-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            background-color: rgba(135, 186, 58, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .service-icon svg {
            width: 30px;
            height: 30px;
            fill: #87BA3A;
        }
        .service-name {
            font-size: 18px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../src/assets/360eye_logo.png" alt="360EYE Logo" class="logo">
        <h1>Immersive <span class="accent">Visual Experiences</span></h1>
        <p>Professional 360° virtual tours and 3D rendering services for real estate marketing in India</p>
        
        <div class="services">
            <div class="service">
                <div class="service-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
                </div>
                <div class="service-name">360° Virtual Tours</div>
            </div>
            <div class="service">
                <div class="service-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H3V8h18v12zM9 10v8l7-4z"/></svg>
                </div>
                <div class="service-name">Commercial Films</div>
            </div>
            <div class="service">
                <div class="service-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm0-18c4.42 0 8 3.58 8 8s-3.58 8-8 8-8-3.58-8-8 3.58-8 8-8zm0 14c3.31 0 6-2.69 6-6s-2.69-6-6-6-6 2.69-6 6 2.69 6 6 6zm0-10c2.21 0 4 1.79 4 4s-1.79 4-4 4-4-1.79-4-4 1.79-4 4-4z"/></svg>
                </div>
                <div class="service-name">3D ArchViz Rendering</div>
            </div>
        </div>
        
        <div class="overlay"></div>
    </div>
</body>
</html>
