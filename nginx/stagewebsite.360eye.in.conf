server {
    server_name stagewebsite.360eye.in;
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;
    proxy_buffer_size 32k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    location /gallery/ {
        set $tour_cookie "";
        if ($http_cookie ~* "(tourAccessToken=[^;]+)") {
            set $tour_cookie $1;
        }
        proxy_set_header Cookie $tour_cookie;
        proxy_pass https://stageapi.360eye.in/gallery/;
        proxy_ssl_server_name on;
        proxy_ssl_name stageapi.360eye.in;
        proxy_set_header Host stageapi.360eye.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Important for cookies
        proxy_cookie_domain stageapi.360eye.in stagewebsite.360eye.in;
        proxy_cookie_path / /;
    }

    location /products/ {
        proxy_pass https://stageapi.360eye.in/products/;
        proxy_ssl_server_name on;
        proxy_ssl_name stageapi.360eye.in;
        proxy_set_header Host stageapi.360eye.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_domain stageapi.360eye.in stagewebsite.360eye.in;
        proxy_cookie_path / /;
    }

    location /uploads/ {
        proxy_pass https://stageapi.360eye.in/uploads/;
        proxy_ssl_server_name on;
        proxy_ssl_name stageapi.360eye.in;
        proxy_set_header Host stageapi.360eye.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_cookie_domain stageapi.360eye.in stagewebsite.360eye.in;
        proxy_cookie_path / /;
    }

    location / {
        root /home/ubuntu/frontend_360eye;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/stagewebsite.360eye.in-access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/stagewebsite.360eye.in-error.log warn;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stagewebsite.360eye.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stagewebsite.360eye.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name stagewebsite.360eye.in;
    return 301 https://$host$request_uri;
}
