<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/360eye_logo.svg" />
    <link rel="shortcut icon" href="/src/assets/360eye_logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <!-- Proper Viewport Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- PWA Configuration -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- SEO Meta Tags -->
    <title>360EYE – 360 Virtual Tours & 3D Rendering for Real Estate Marketing in India</title>
    <meta name="description" content="360EYE provides professional 360° virtual tours and 3D rendering services for real estate marketing in India. Immersive virtual reality experiences for properties." />
    
    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stagewebsite.360eye.in/" />
    <meta property="og:title" content="360EYE – 360 Virtual Tours & 3D Rendering for Real Estate Marketing in India" />
    <meta property="og:description" content="360EYE provides professional 360° virtual tours and 3D rendering services for real estate marketing in India." />
    <meta property="og:image" content="https://stagewebsite.360eye.in/social-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="360EYE" />
    
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@360eye" />
    <meta name="twitter:title" content="360EYE – 360 Virtual Tours & 3D Rendering for Real Estate Marketing in India" />
    <meta name="twitter:description" content="360EYE provides professional 360° virtual tours and 3D rendering services for real estate marketing in India." />
    <meta name="twitter:image" content="https://stagewebsite.360eye.in/social-share.jpg" />
  </head>
  <body style="margin: 0; padding: 0; overflow-x: hidden;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/disable-inspection.js"></script>
    
    <script>
      // Handle mobile viewport height
      function updateViewportHeight() {
        document.documentElement.style.setProperty(
          '--vh', 
          `${window.innerHeight * 0.01}px`
        );
      }
      
      // Initial setup
      updateViewportHeight();
      
      // Update on resize
      window.addEventListener('resize', updateViewportHeight);
      window.addEventListener('orientationchange', updateViewportHeight);
      
      // Trigger resize after load
      window.addEventListener('load', () => {
        setTimeout(updateViewportHeight, 300);
      });
    </script>
  </body>
</html>
